[project]
name = "osmfirme"
version = "0.1.0"
description = "OSM firme - izvlacenje poslovnih podataka iz OpenStreetMap-a"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "requests>=2.31",
    "openpyxl>=3.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# Vercel loads the FastAPI instance from webapp/main.py. Without this it finds
# `app` in both test_webapp_api.py and webapp/main.py and refuses to guess.
[tool.vercel]
entrypoint = "webapp.main:app"

# This repo is an application, not a distributable package: there is nothing to
# build, so uv must not try to install the root as a wheel.
[tool.uv]
package = false
